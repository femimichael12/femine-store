<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0c0c"/>
      <stop offset="50%" stop-color="#140707"/>
      <stop offset="100%" stop-color="#0a0303"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e76f51" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e76f51" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="128" fill="url(#glow)"/>
  
  <!-- Subtle Luxury Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#e76f51" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Brand Typography F • -->
  <g transform="translate(256, 275)" text-anchor="middle">
    <!-- Main Letter F -->
    <text x="-25" y="45" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="280" font-weight="700" fill="#ffffff" letter-spacing="-8">F</text>
    <!-- Coral Accent Dot -->
    <circle cx="125" cy="15" r="28" fill="#e76f51"/>
  </g>
</svg>